name: Update News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Download news
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json

          feeds = {
              "sudan": "https://news.google.com/rss/search?q=Sudan&hl=ar&gl=SD&ceid=SD:ar",
              "ethiopia": "https://feeds.bbci.co.uk/news/topics/cwlw3xz047jt/rss.xml",
              "somalia": "https://news.google.com/rss/search?q=Somalia&hl=en&gl=US&ceid=US:en",
              "football": "https://news.google.com/rss/search?q=كرة+القدم+السودانية&hl=ar&gl=SD&ceid=SD:ar"
          }

          result = {}

          for country, url in feeds.items():
              try:
                  data = urllib.request.urlopen(url, timeout=20).read()
                  root = ET.fromstring(data)

                  articles = []

                  for item in root.findall(".//item")[:10]:
                      title = item.findtext("title", "")
                      link = item.findtext("link", "")
                      date = item.findtext("pubDate", "")

                      articles.append({
                          "title": title,
                          "link": link,
                          "date": date
                      })

                  result[country] = articles

              except Exception as e:
                  result[country] = []
                  print(country, "ERROR:", e)

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("News file created successfully")
          PY

      - name: Save news
        run: |
          git config user.name "News Bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git commit -m "Update news" || echo "No changes"
          git push
