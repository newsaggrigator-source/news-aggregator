name: Update News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      
      - name: Download news
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import json
          from html.parser import HTMLParser
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          now = datetime.now(timezone.utc)

          def parse_date(date_text):
              if not date_text:
                  return None
              try:
                  published = parsedate_to_datetime(date_text)
                  if published.tzinfo is None:
                      published = published.replace(tzinfo=timezone.utc)
                  return published.astimezone(timezone.utc)
              except (TypeError, ValueError, OverflowError):
                  return None

          feeds = {
              "sudan": "https://news.google.com/rss/search?q=Sudan&hl=ar&gl=SD&ceid=SD:ar",
              "ethiopia": [
                  "https://allafrica.com/tools/headlines/rdf/ethiopia/headlines.rdf",
                   "https://news.google.com/rss/search?q=Ethiopia+politics+OR+security+OR+society&hl=en-US&gl=US&ceid=US:en"
           ],
              "somalia": "https://news.google.com/rss/search?q=Somalia&hl=en&gl=US&ceid=US:en",
              "football": [
                  "https://sudanplatform.net/tag/رئيس-الهلال/feed",
                  "https://sudanplatform.net/tag/نادي-المريخ-السوداني/feed",
                  "https://aljamhoria.net/tag/الهلال-السوداني/feed/",
                  "https://alzool.news/tag/الهلال-السوداني/feed",
                  "https://akher-khabar.com/archives/tag/الهلال-السوداني/feed",
                  "https://news.google.com/rss/search?q=%D8%A7%D9%84%D9%87%D9%84%D8%A7%D9%84+%D8%A7%D9%84%D8%B3%D9%88%D8%AF%D8%A7%D9%86%D9%8A+OR+%D8%A7%D9%84%D9%85%D8%B1%D9%8A%D8%AE+%D8%A7%D9%84%D8%B3%D9%88%D8%AF%D8%A7%D9%86%D9%8A+when%3A3d&hl=ar&gl=SD&ceid=SD%3Aar"
            ]
          }

          result = {}

          class FootballParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_heading = False
                  self.in_link = False
                  self.current_title = ""
                  self.current_link = ""
                  self.articles = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag in ("h2", "h3"):
                      self.in_heading = True

                  if tag == "a" and self.in_heading:
                      self.in_link = True
                      self.current_link = attrs.get("href", "")
                      self.current_title = ""

              def handle_data(self, data):
                  if self.in_heading and self.in_link:
                      self.current_title += data.strip()

              def handle_endtag(self, tag):
                  if tag == "a" and self.in_link:
                      if self.current_title and self.current_link:
                          self.articles.append({
                              "title": self.current_title,
                              "link": self.current_link,
                              "date": ""
                          })
                      self.in_link = False

                  if tag in ("h2", "h3"):
                      self.in_heading = False

                      
          for country, urls in feeds.items():
              if isinstance(urls, str):
                  urls = [urls]

              recent_articles = []
              fallback_articles = []
              seen = set()

              for url in urls:
                  try:
                  
                      safe_url = urllib.parse.quote(url, safe=":/?=&%")
                      data = urllib.request.urlopen(safe_url, timeout=20).read()

                      root = ET.fromstring(data)

                      for elem in root.iter():
                          elem.tag = elem.tag.split("}", 1)[-1]

                      items = root.findall(".//item")
                      print(country, "FEED ITEMS:", url, len(items))
                      print(country, "FEED SAMPLE:", url, [i.findtext("title", "") for i in items[:3]])
                      if country == "ethiopia" and "allafrica.com" in url:
                          print("ALLAFRICA DATE FIELDS:", [elem.tag for elem in items[0]] if items else [])

                      
                      for item in items:
                          title = item.findtext("title", "").strip()
                          link = item.findtext("link", "").strip()
                          date = item.findtext("pubDate", "")
                          published = parse_date(date)
                          if country == "ethiopia" and "allafrica.com" in url:
                              print("ALLAFRICA DATE CHECK:", repr(date), "| parsed:", published)

                          if country == "football":
                              print("FOOTBALL DATE CHECK:", title, "| raw date:", repr(date), "| parsed:", published)

                          
                          if not title or not link or published is None:
                              continue
                          if country == "sudan":
                              arabic_chars = sum("\u0600" <= ch <= "\u06FF" for ch in title)
                              latin_chars = sum(ch.isascii() and ch.isalpha() for ch in title)
                              if arabic_chars < latin_chars:
                                  continue

                          if country == "football":
                              sport_keywords = [
                                  "الهلال السوداني",
                                  "المريخ السوداني",
                                  "المنتخب السوداني",
                                  "منتخب السودان",
                                  "كرة القدم",
                                  "دوري أبطال أفريقيا",
                                  "الدوري السوداني",
                                  "مباراة",
                                  "لاعب الهلال",
                                  "لاعب المريخ",
                                  "مدرب الهلال",
                                  "مدرب المريخ",
                                  "السنغال",
                                  "سيداما",
                                  "رايون سبورت",
                                  "أيجل نوار",
                                  "أبطال أفريقيا"
                              ]

                              if not any(word in title for word in sport_keywords):
                                  continue

                          age_hours = (now - published).total_seconds() / 3600
                          max_age_hours = 336 if country == "ethiopia" else (168 if country == "football" else 72)

                          if age_hours < 0 or age_hours > max_age_hours:
                              continue

                          if link in seen:
                              continue
                          seen.add(link)

                          
                          image_url = ""
                          for media in item.iter():
                              tag = media.tag.lower().split("}")[-1]
                              if tag in ("thumbnail", "content", "enclosure"):
                                  candidate = media.attrib.get("url", "")
                                  media_type = media.attrib.get("type", "").lower()
                                  is_image = (
                                      media_type.startswith("image/")
                                      or candidate.lower().split("?")[0].endswith(
                                          (".jpg", ".jpeg", ".png", ".webp", ".gif")
                                      )
                                  )
                                  if (
                                      candidate.startswith(("http://", "https://"))
                                      and (tag != "enclosure" or is_image)
                                  ):
                                      image_url = candidate
                                      break

                          article = {
                              "title": title,
                              "link": link,
                              "date": date,
                              "image": image_url
                          }

                          if age_hours <= 48:
                              recent_articles.append((published, article))
                          else:
                              fallback_articles.append((published, article))


                  except Exception as e:
                      print(country, "FEED ERROR:", url, e)

              recent_articles.sort(key=lambda x: x[0], reverse=True)
              fallback_articles.sort(key=lambda x: x[0], reverse=True)

              selected = recent_articles[:10]

              if len(selected) < 10:
                  remaining = 10 - len(selected)
                  selected.extend(fallback_articles[:remaining])

              result[country] = [
                  article for published, article in selected
              ]
              print(country, "SELECTED ARTICLES:", len(selected))
              if country == "ethiopia":
                  for published, article in selected:
                      print("ETHIOPIA SELECTED SOURCE:", article["date"], article["link"])

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("News file created successfully")
          PY

      - name: Prepare article text
        run: |
          python -m pip install googlenewsdecoder==0.2.2
          python - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          from googlenewsdecoder import gnewsdecoder
          import re
          from html.parser import HTMLParser

          with open("news.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []
                  self.skip = False

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style", "noscript"):
                      self.skip = True

              def handle_endtag(self, tag):
                  if tag in ("script", "style", "noscript"):
                      self.skip = False

              def handle_data(self, data):
                  if not self.skip:
                      text = data.strip()
                      if text:
                          self.text.append(text)

          
          for category, articles in data.items():
              for article in articles:
                  url = article.get("link", "")
                  if "news.google.com" in url.lower():
                      try:
                          decoded = gnewsdecoder(url)
                          print("GOOGLE NEWS DECODER RESULT:", decoded)
                          if decoded.get("success") and decoded.get("decoded_url"):
                              url = decoded["decoded_url"].strip()
                              print("DEBUG DECODED URL REPR:", repr(url))
                              if url.startswith("[") and "](" in url:
                                  url = url[1:].split("](", 1)[0]
                              print("CLEANED URL REPR:", repr(url))
                              print("GOOGLE NEWS DECODED URL:", url)
                      except Exception as e:
                          print("Google News decode failed:", e)

                  if not url:
                      article["content"] = ""
                      continue

                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0"}
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=20
                      ) as response:
                          html = response.read().decode(
                              response.headers.get_content_charset() or "utf-8",
                              errors="replace"
                          )
                          final_url = response.geturl()

                      if "news.google.com" in url.lower():
                          url = final_url
                      
                      
                      
                      
                      image_url = article.get("image", "")
                      if category in ("sudan", "ethiopia", "somalia", "football") and "news.google.com" not in url.lower():
                          for pattern in (
                              r'<meta[^>]*property=["\']og:image["\'][^>]*content=["\']([^"\']+)["\']',
                              r'<meta[^>]*content=["\']([^"\']+)["\'][^>]*property=["\']og:image["\']',
                              r'<meta[^>]*name=["\']twitter:image["\'][^>]*content=["\']([^"\']+)["\']',
                              r'<meta[^>]*content=["\']([^"\']+)["\'][^>]*name=["\']twitter:image["\']'
                          ):
                              image_match = re.search(
                                  pattern, html, re.IGNORECASE
                              )
                              if image_match:
                                  image_url = image_match.group(1).strip()
                                  break

                      article["image"] = "" if any(word in image_url.lower() for word in ("logo", "favicon", "site-icon", "masthead", "brand")) else image_url

                      parser = TextParser()
                      parser.feed(html)

                      text = " ".join(parser.text)
                      print("ARTICLE TEXT LENGTH:", len(text), "| CATEGORY:", category, "| TITLE:", article.get("title", "")[:60], "| URL:", url)
                      text = re.sub(r"\s+", " ", text).strip()

                      if category == "football":
                          article["content"] = text[:12000]
                      else:
                          article["content"] = text[:20000]

                  except Exception as e:
                      article["content"] = ""
                      print(
                          "Article error:",
                          article.get("link"),
                          e
                      )

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Article text prepared")
          PY

      
      - name: Summarize new articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import re
          from datetime import datetime, timezone

          with open("news.json", encoding="utf-8") as f:
              data = json.load(f)

          try:
              with open("summaries.json", encoding="utf-8") as f:
                  summaries = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              summaries = {}

          def normalize_url(url):
              parts = urllib.parse.urlsplit(url or "")
              query = urllib.parse.parse_qsl(parts.query)
              query = [
                  (k, v) for k, v in query
                  if not k.lower().startswith("utm_")
                  and k.lower() not in ("fbclid", "gclid")
              ]
              return urllib.parse.urlunsplit((
                  parts.scheme.lower(),
                  parts.netloc.lower(),
                  parts.path.rstrip("/"),
                  urllib.parse.urlencode(query),
                  ""
              ))

          api_key = os.environ.get("OPENAI_API_KEY")
          new_count = 0
          skipped_saved = 0
          skipped_no_content = 0
          skipped_no_api_key = 0


          for category, articles in data.items():
              for article in articles:
                  url = normalize_url(article.get("link", ""))

                  if not url:
                      continue

                  
                  old = summaries.get(url)

                  if isinstance(old, dict) and old.get("summary"):
                      article["summary"] = old["summary"]
                      skipped_saved += 1
                      continue

                  if isinstance(old, str) and old.strip():
                      article["summary"] = old
                      skipped_saved += 1
                      continue



                  
                  content = article.get("content", "").strip()

                  if not content:
                      skipped_no_content += 1
                      continue

                  if not api_key:
                      skipped_no_api_key += 1
                      continue


                  prompt = (
                      "Summarize this news article in 150-160 words. "
                      "The summary MUST contain at least 150 words and "
                      "no more than 160 words. Count the words before "
                      "responding and revise if necessary. "
                      "Be factual, clear and concise. Do not invent facts. "
                      "Write in the same language as the article title. "
                      "Return only the summary.\n\n"
                      "Title: " + article.get("title", "") +
                      "\n\nArticle text:\n" + content[:12000]
                 )

                  payload = {
                      "model": "gpt-4o-mini",
                      "messages": [
                          {
                              "role": "user",
                              "content": prompt
                          }
                      ],
                      "max_tokens": 350,
                      "temperature": 0.2
                  }

                  
                  
                  try:
                      summary = ""
                      payload["messages"][0]["content"] = prompt

                      request = urllib.request.Request(
                          "https://api.openai.com/v1/chat/completions",
                          data=json.dumps(payload).encode("utf-8"),
                          headers={
                              "Authorization": "Bearer " + api_key,
                              "Content-Type": "application/json"
                          },
                          method="POST"
                      )

                      with urllib.request.urlopen(
                          request, timeout=60
                      ) as response:
                          result = json.loads(
                              response.read().decode("utf-8")
                          )

                      candidate = result["choices"][0]["message"][
                          "content"
                      ].strip()

                      word_count = len(
                          re.findall(r"\b\w+\b", candidate)
                      )

                      if (
                          word_count >= 150
                          and not candidate.startswith(("عذرًا", "عذراً"))
                      ):
                          summary = candidate
                      else:
                          print(
                              "Word count outside range:",
                              word_count
                          )

                      if summary:
                          summaries[url] = {
                              "summary": summary,
                              "updated_at": datetime.now(
                                  timezone.utc
                              ).isoformat()
                          }
                          article["summary"] = summary
                          new_count += 1
                          print(
                              "Summary created:",
                              article.get("title", "")[:80]
                          )
                      else:
                          print(
                              "Summary rejected:",
                              article.get("title", "")[:80]
                          )

                  except Exception as e:
                      print(
                          "Summary error:",
                          article.get("title", "")[:80],
                          str(e)[:300]
                      )


          with open("summaries.json", "w", encoding="utf-8") as f:
              json.dump(summaries, f, ensure_ascii=False, indent=2)

          for category, articles in data.items():
              data[category] = [
                  article for article in articles
                  if isinstance(article, dict)
                  and str(article.get("title", "")).strip()
              ]
              print(
                  category,
                  "ARTICLES WITH SUMMARIES:",
                  len(data[category])
              )

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("New summaries created:", new_count)
          print("Saved summaries:", len(summaries))
          print("Skipped - saved summaries:", skipped_saved)
          print("Skipped - no article text:", skipped_no_content)
          print("Skipped - no API key:", skipped_no_api_key)
          PY

      
      - name: Generate article pages
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import hashlib
          import html

          with open("news.json", "r", encoding="utf-8") as f:
              news = json.load(f)
          if isinstance(news, dict):
              articles = [
                  item
                  for value in news.values()
                  if isinstance(value, list)
                  for item in value
                  if isinstance(item, dict)
              ]
          elif isinstance(news, list):
              articles = [item for item in news if isinstance(item, dict)]
          else:
              articles = []

          os.makedirs("news", exist_ok=True)

          for article in articles:
              title = str(article.get("title", "خبر"))
              link = str(article.get("link", ""))
              summary = str(article.get("summary", ""))
              date = str(article.get("date", ""))

              if not link:
                  continue

              slug = re.sub(r"[^\w-]+", "-", title.lower(), flags=re.UNICODE).strip("-")
              slug = slug[:60] or "story"
              slug += "-" + hashlib.sha1(link.encode("utf-8")).hexdigest()[:10]

              page_url = f"https://aynnews.net/news/{slug}.html"
              article["page_url"] = page_url

              safe_title = html.escape(title)
              safe_summary = html.escape(summary)
              safe_date = html.escape(date)
              safe_link = html.escape(link, quote=True)
              image_url = str(article.get("image", ""))
              if "logo" in image_url.lower():
                  image_url = ""
              safe_image = html.escape(image_url, quote=True)
              page = f"""<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{safe_title} | عين نيوز</title>
            <meta name="description" content="{safe_summary[:250]}">
            <meta property="og:title" content="{safe_title}">
            <meta property="og:description" content="{safe_summary[:250]}">
            <meta property="og:type" content="article">
            <meta property="og:url" content="{page_url}">
            <script>
            function shareNews() {{
              if (navigator.share) {{
                 navigator.share({{title: document.title, url: location.href}});
               }} else if (navigator.clipboard) {{
                 navigator.clipboard.writeText(location.href).then(function() {{
                   alert('تم نسخ رابط الخبر');
                 }});
               }} else {{
                  prompt('انسخ رابط الخبر:', location.href);
               }}
            }}
           </script>
          </head>
          <body style="font-family:Arial,sans-serif;max-width:800px;margin:30px auto;padding:20px;line-height:1.9;color:#222">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <a href="https://aynnews.net/" style="color:#16834a">عين نيوز</a>
              <button onclick="shareNews()" style="background:#16834a;color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:15px">↗ مشاركة الخبر</button>
            </div>
            <hr>
            <h1 dir="auto">{safe_title}</h1>
            <img src="{safe_image}" alt="{safe_title}" style="width:100%;height:auto;border-radius:10px;margin:15px 0;" onerror="this.style.display='none'">
            <p style="color:#666">{safe_date}</p>
            <p dir="auto" style="text-align: justify; text-indent: 25px;">{safe_summary}</p>
            <p><a href="{safe_link}" target="_blank" rel="noopener noreferrer">اقرأ الخبر من المصدر الأصلي</a></p>
            <hr>
            <a href="https://aynnews.net/">العودة إلى الصفحة الرئيسية</a>
          </body>
          </html>
          """

              with open(f"news/{slug}.html", "w", encoding="utf-8") as f:
                  f.write(page)

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(news, f, ensure_ascii=False, indent=2)
          PY

      - name: Save news
        run: |
          git config user.name "News Bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json summaries.json news/
          git commit -m "Update news" || echo "No changes"
          git push
