name: Update News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      
      - name: Download news
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import json
          from html.parser import HTMLParser
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          now = datetime.now(timezone.utc)

          def parse_date(date_text):
              if not date_text:
                  return None
              try:
                  published = parsedate_to_datetime(date_text)
                  if published.tzinfo is None:
                      published = published.replace(tzinfo=timezone.utc)
                  return published.astimezone(timezone.utc)
              except (TypeError, ValueError, OverflowError):
                  return None

          feeds = {
              "sudan": "https://news.google.com/rss/search?q=Sudan&hl=ar&gl=SD&ceid=SD:ar",
              "ethiopia": "https://feeds.bbci.co.uk/news/topics/cwlw3xz047jt/rss.xml",
              "somalia": "https://news.google.com/rss/search?q=Somalia&hl=en&gl=US&ceid=US:en",
              "football": [
                  "https://sudanplatform.net/tag/رئيس-الهلال/feed",
                  "https://sudanplatform.net/tag/نادي-المريخ-السوداني/feed",
                  "https://aljamhoria.net/tag/الهلال-السوداني/feed/",
                  "https://alzool.news/tag/الهلال-السوداني/feed",
                  "https://akher-khabar.com/archives/tag/الهلال-السوداني/feed",
                  "https://news.google.com/rss/search?q=%D8%A7%D9%84%D9%87%D9%84%D8%A7%D9%84+%D8%A7%D9%84%D8%B3%D9%88%D8%AF%D8%A7%D9%86%D9%8A+OR+%D8%A7%D9%84%D9%85%D8%B1%D9%8A%D8%AE+%D8%A7%D9%84%D8%B3%D9%88%D8%AF%D8%A7%D9%86%D9%8A+when%3A3d&hl=ar&gl=SD&ceid=SD%3Aar"
            ]
          }

          result = {}

          class FootballParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_heading = False
                  self.in_link = False
                  self.current_title = ""
                  self.current_link = ""
                  self.articles = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag in ("h2", "h3"):
                      self.in_heading = True

                  if tag == "a" and self.in_heading:
                      self.in_link = True
                      self.current_link = attrs.get("href", "")
                      self.current_title = ""

              def handle_data(self, data):
                  if self.in_heading and self.in_link:
                      self.current_title += data.strip()

              def handle_endtag(self, tag):
                  if tag == "a" and self.in_link:
                      if self.current_title and self.current_link:
                          self.articles.append({
                              "title": self.current_title,
                              "link": self.current_link,
                              "date": ""
                          })
                      self.in_link = False

                  if tag in ("h2", "h3"):
                      self.in_heading = False

                      
          for country, urls in feeds.items():
              if isinstance(urls, str):
                  urls = [urls]

              recent_articles = []
              fallback_articles = []
              seen = set()

              for url in urls:
                  try:
                  
                      safe_url = urllib.parse.quote(url, safe=":/?=&%")
                      data = urllib.request.urlopen(safe_url, timeout=20).read()

                      root = ET.fromstring(data)

                      for elem in root.iter():
                          elem.tag = elem.tag.split("}", 1)[-1]

                      items = root.findall(".//item")
                      print(country, "FEED ITEMS:", url, len(items))

                      
                      for item in items:
                          title = item.findtext("title", "").strip()
                          link = item.findtext("link", "").strip()
                          date = item.findtext("pubDate", "")
                          published = parse_date(date)

                          if country == "football":
                              print("FOOTBALL DATE CHECK:", title, "| raw date:", repr(date), "| parsed:", published)

                          
                          if not title or not link or published is None:
                              continue

                          if country == "football":
                              sport_keywords = [
                                  "الهلال السوداني",
                                  "المريخ السوداني",
                                  "المنتخب السوداني",
                                  "منتخب السودان",
                                  "كرة القدم",
                                  "دوري أبطال أفريقيا",
                                  "الدوري السوداني",
                                  "مباراة",
                                  "لاعب الهلال",
                                  "لاعب المريخ",
                                  "مدرب الهلال",
                                  "مدرب المريخ",
                                  "السنغال",
                                  "سيداما",
                                  "رايون سبورت",
                                  "أيجل نوار",
                                  "أبطال أفريقيا"
                              ]

                              if not any(word in title for word in sport_keywords):
                                  continue

                          age_hours = (now - published).total_seconds() / 3600
                          max_age_hours = 336 if country == "ethiopia" else (168 if country == "football" else 72)

                          if age_hours < 0 or age_hours > max_age_hours:
                              continue

                          if link in seen:
                              continue
                          seen.add(link)

                          article = {
                              "title": title,
                              "link": link,
                              "date": date
                          }

                          if age_hours <= 48:
                              recent_articles.append((published, article))
                          else:
                              fallback_articles.append((published, article))


                  except Exception as e:
                      print(country, "FEED ERROR:", url, e)

              recent_articles.sort(key=lambda x: x[0], reverse=True)
              fallback_articles.sort(key=lambda x: x[0], reverse=True)

              selected = recent_articles[:10]

              if len(selected) < 10:
                  remaining = 10 - len(selected)
                  selected.extend(fallback_articles[:remaining])

              result[country] = [
                  article for published, article in selected
              ]
              print(country, "SELECTED ARTICLES:", len(selected))

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("News file created successfully")
          PY

      - name: Prepare article text
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import re
          from html.parser import HTMLParser

          with open("news.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []
                  self.skip = False

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style", "noscript"):
                      self.skip = True

              def handle_endtag(self, tag):
                  if tag in ("script", "style", "noscript"):
                      self.skip = False

              def handle_data(self, data):
                  if not self.skip:
                      text = data.strip()
                      if text:
                          self.text.append(text)

          for category, articles in data.items():
              for article in articles:
                  if category == "football":
                      article["content"] = ""
                      continue
                  try:
                      url = article.get("link", "")

                      if not url:
                          continue

                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0"}
                      )

                      html = urllib.request.urlopen(
                          request,
                          timeout=20
                      ).read().decode("utf-8", errors="ignore")

                      parser = TextParser()
                      parser.feed(html)

                      text = " ".join(parser.text)
                      text = re.sub(r"\s+", " ", text).strip()

                      article["content"] = text[:20000]

                  except Exception as e:
                      article["content"] = ""
                      print(
                          "Article error:",
                          article.get("link"),
                          e
                      )

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Article text prepared")
          PY

      - name: Save news
        run: |
          git config user.name "News Bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git commit -m "Update news" || echo "No changes"
          git push
