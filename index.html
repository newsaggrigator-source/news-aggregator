<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عين نيوز</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tahoma', 'Arial', sans-serif;
    background: #fff;
  }

  /* ====== الهيدر ====== */
  .header {
    position: relative;
    width: 100%;
    height: 130px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    overflow: hidden;
    border-bottom: 3px solid #0e7a3a;
  }

  /* شريط أخضر أعلى اليمين */
  .header::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 280px;
    height: 90px;
    background: linear-gradient(135deg, #0e7a3a 0%, #14a04e 55%, transparent 55%);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
    z-index: 0;
  }

  /* شريط أخضر أسفل اليسار */
  .header::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 280px;
    height: 90px;
    background: linear-gradient(315deg, #0e7a3a 0%, #14a04e 55%, transparent 55%);
    clip-path: polygon(0 0, 0 100%, 100% 100%);
    z-index: 0;
  }

  /* ====== الأقسام الثلاثة ====== */
  .right-section,
  .center-section,
  .left-section {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
  }

  .right-section { order: 3; gap: 15px; }
  .center-section { order: 2; flex: 1; justify-content: center; }
  .left-section  { order: 1; gap: 15px; }

  /* ====== شريط البحث ====== */
  .search-box {
    display: flex;
    align-items: center;
    background: #fff;
    border: 2px solid #0e7a3a;
    border-radius: 25px;
    padding: 7px 14px;
    width: 220px;
    transition: 0.3s;
  }

  .search-box:hover { box-shadow: 0 0 8px rgba(14, 122, 58, 0.35); }

  .search-box svg {
    width: 16px;
    height: 16px;
    fill: #0e7a3a;
    margin-left: 8px;
    flex-shrink: 0;
  }

  .search-box input {
    border: none;
    outline: none;
    font-size: 13px;
    width: 100%;
    font-family: inherit;
    color: #333;
    background: transparent;
  }

  .search-box input::placeholder { color: #999; }

  /* ====== اللوقو ====== */
  .logo-img {
    height: 90px;
    width: auto;
    object-fit: contain;
  }

  /* ====== القائمة (HTML حقيقية) ====== */
  .nav-menu {
    display: flex;
    align-items: center;
    gap: 22px;
    list-style: none;
  }

  .nav-menu a {
    text-decoration: none;
    color: #1a1a1a;
    font-size: 16px;
    font-weight: bold;
    font-family: 'Tahoma', sans-serif;
    padding: 6px 10px;
    border-radius: 6px;
    transition: 0.25s;
    position: relative;
  }

  .nav-menu a:hover {
    color: #0e7a3a;
    background: rgba(14, 122, 58, 0.08);
  }

  /* العنصر النشط (الرئيسية) */
  .nav-menu a.active {
    background: #0e7a3a;
    color: #fff;
    padding: 8px 18px;
    border-radius: 8px;
    box-shadow: 0 3px 8px rgba(14, 122, 58, 0.3);
  }

  .nav-menu a.active:hover {
    background: #0a5c2b;
    color: #fff;
  }

  /* خط أسفل العنصر النشط */
  .nav-menu a.active::after {
    content: "";
    position: absolute;
    bottom: -8px;
    right: 0;
    width: 100%;
    height: 2px;
    background: #0e7a3a;
    border-radius: 2px;
  }

  /* ====== موبايل ====== */
  @media (max-width: 900px) {
    .header {
      height: auto;
      flex-direction: column;
      padding: 12px 15px;
      gap: 10px;
    }

    .header::before,
    .header::after {
      width: 150px;
      height: 55px;
    }

    .right-section { order: 3; }
    .center-section { order: 1; }
    .left-section { order: 2; }

    .logo-img { height: 65px; }

    .nav-menu {
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-menu a {
      font-size: 13px;
      padding: 5px 8px;
    }

    .nav-menu a.active {
      padding: 6px 14px;
    }

    .search-box {
      width: 100%;
      max-width: 280px;
    }
  }
</style>
</head>
<body>

  <header class="header">

    <!-- القائمة (يمين في RTL) -->
    <div class="right-section">
      <ul class="nav-menu">
        <li><a href="#" class="active">الرئيسية</a></li>
        <li><a href="#أخبار">أخبار</a></li>
        <li><a href="#المنطقة">المنطقة</a></li>
        <li><a href="#رياضة">رياضة</a></li>
        <li><a href="#منوعات">منوعات</a></li>
        <li><a href="#من-نحن">من نحن</a></li>
      </ul>
    </div>

    <!-- اللوقو (المنتصف) -->
    <div class="center-section">
      <img src="header-new.png" alt="عين نيوز" class="logo-img">
    </div>

    <!-- البحث (يسار في RTL) -->
    <div class="left-section">
      <form class="search-box" onsubmit="event.preventDefault();">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" placeholder="ابحث في الأخبار...">
      </form>
    </div>

  </header>

</body>
</html>
